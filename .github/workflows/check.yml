name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check scans the whole history for secrets, not just the tree.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.5
      - id: go_cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go_cache.outputs.build }}
            ${{ steps.go_cache.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      # mise's task artifact cache: a task whose inputs match an entry replays
      # instead of running. Pull requests read what main has proven; only main
      # writes, so a pull request can never seed an entry main relies on.
      - id: task-cache
        run: echo "dir=$(mise cache path)/task-artifacts" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-tasks-${{ runner.os }}-${{ runner.arch }}-
      - name: Check
        run: mise run check
      - name: Release snapshot
        if: runner.os == 'Linux'
        run: mise run dist
      - name: Finder Favorites canary
        if: runner.os == 'macOS'
        run: mise run check:darwin-native
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  required-check:
    name: Check
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require platform proofs
        if: needs.check.result != 'success'
        run: exit 1
