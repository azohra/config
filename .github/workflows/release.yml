name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.14
      - name: Build release
        run: mise run build:release "$GITHUB_REF_NAME"
      - name: Attest release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/config-darwin-*
            dist/checksums.txt
            dist/version.txt
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run release "$GITHUB_REF_NAME"
