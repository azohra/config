name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main
        required: true
        type: string

# The build runs the repository's whole check. It reads; it publishes nothing.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          sha=$(mise run --quiet release:source -- "$RELEASE_TAG")
          [ "$sha" = "$WORKFLOW_SHA" ] || { echo "Start at the tagged main commit; retry the original run after main advances" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: source
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - id: go_cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go_cache.outputs.build }}
            ${{ steps.go_cache.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - name: Build release
        run: mise run build:release "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [source, build]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bosun-release
    # Only this job attests and publishes, and it builds nothing.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Attest release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/config-darwin-*
            dist/LICENSE
            dist/third-party-licenses.tar.gz
            dist/checksums.txt
            dist/version.txt
      - id: bosun
        name: Mint Bosun release token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BOSUN_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_PRIVATE_KEY }}
          owner: azohra
          repositories: config
          permission-contents: write
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ steps.bosun.outputs.token }}
        run: mise run release "$RELEASE_TAG"
