# Config converges a Mac against one exact mise, spelled as testedMiseVersion in
# internal/config/mise.go. TestMisePhasesCoverEveryBootstrapPhase reads the mise
# on PATH, so the toolchain has to be that same release for the guard to mean
# anything. Move this line, the workflow pins, and testedMiseVersion together.
min_version = "2026.9.1"

[tools]
go = "1.27.1"
git-cliff = "2.14.1"
gitleaks = "8.30.0"
node = "24"
shellcheck = "0.11.0"
wrangler = "4.129.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tasks.format]
description = "Format Go source"
run = "gofmt -w cmd internal"

[tasks.build]
description = "Build Config for the current platform"
run = "mkdir -p .build && go build -trimpath -o .build/config ./cmd/config"
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go"]
outputs = [".build/config"]

[tasks."test:site"]
description = "Lint and prove the bootstrap script"
run = "bash -n bootstrap.sh && shellcheck -s bash bootstrap.sh && node --test site/bootstrap.test.mjs"

[tasks.check]
description = "Prove formatting, behavior, dependencies, and repository safety"
depends = ["test:site"]
run = """
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(gofmt -l cmd internal)
[[ -z $unformatted ]] || { printf 'Run gofmt on:\n%s\n' "$unformatted" >&2; exit 1; }
go vet ./...
go test -race ./...
govulncheck ./...
go mod verify
gitleaks dir --no-banner --redact .
# gitleaks dir reads the working tree, and gitleaks git scans nothing at all
# from a worktree, where .git is a file. History is permanent, so it is scanned
# from the log itself.
git log --all -p | gitleaks stdin --no-banner --redact
"""

[tasks."check:darwin-native"]
description = "Read Finder Favorites through the native macOS integration"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ $(uname -s) == Darwin ]] || {
  echo "check:darwin-native: this canary requires macOS" >&2
  exit 1
}
tests=$(go test -tags=config_native_canary ./internal/config \
  -list '^TestFinderFavoritesNativeCanary$')
grep -qx 'TestFinderFavoritesNativeCanary' <<<"$tests" || {
  echo "check:darwin-native: the Finder Favorites canary is unavailable" >&2
  exit 1
}
go test -tags=config_native_canary ./internal/config \
  -run '^TestFinderFavoritesNativeCanary$' -count=1

# The Chrome PWA tests skip themselves when Chrome is absent, and a skip is
# invisible in an ordinary run. Select them by prefix rather than by name, so a
# Chrome-dependent test written tomorrow is covered the day it is written.
output=$(go test ./internal/config -run '^TestChromePWA' -count=1 -v)
printf '%s\n' "$output"
if grep -q -- '--- SKIP' <<<"$output"; then
  echo "check:darwin-native: a Chrome PWA proof skipped itself" >&2
  exit 1
fi
declared=$(go test ./internal/config -list '^TestChromePWA' | grep -c '^TestChromePWA' || true)
passed=$(grep -c -- '--- PASS: TestChromePWA' <<<"$output" || true)
[[ $declared -gt 0 && $passed -eq $declared ]] || {
  echo "check:darwin-native: $passed of $declared Chrome PWA proofs ran" >&2
  exit 1
}
"""

[tasks."build:dist"]
description = "Build the Apple Silicon archive and checksums"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${RELEASE_VERSION:-v0.0.0-dev}"
rm -rf dist
mkdir -p dist/package
CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
  go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" \
  -o dist/package/config ./cmd/config
cp LICENSE dist/package/
GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
  go-licenses save ./cmd/config --ignore github.com/azohra/config \
    --save_path dist/package/third-party-licenses
COPYFILE_DISABLE=1 tar -czf dist/config_darwin_arm64.tar.gz \
  -C dist/package config LICENSE third-party-licenses
(cd dist && shasum -a 256 config_darwin_arm64.tar.gz > checksums.txt)
'''

[tasks.changelog]
description = "Render the changelog from Conventional commits"
run = "git cliff"

[tasks.release]
description = "Build and publish a release from current main"
tools = { gh = "2.100.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -z "$(git status --porcelain)" ] || { echo 'release: commit changes first' >&2; exit 1; }
git fetch -q origin main --tags
head=$(git rev-parse HEAD)
[ "$head" = "$(git rev-parse origin/main)" ] || { echo 'release: check out current main first' >&2; exit 1; }
tag=$(git cliff --offline --unreleased --bumped-version)
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
[ "$tag" != "$(git describe --tags --abbrev=0 --match 'v[0-9]*')" ] || { echo 'No new Conventional changes to release'; exit 0; }
RELEASE_VERSION="$tag" mise run build:dist
git cliff --unreleased --tag "$tag" > dist/notes.md
gh release create "$tag" dist/config_darwin_arm64.tar.gz dist/checksums.txt \
  --repo azohra/config --target "$head" \
  --title "Config $tag" --notes-file dist/notes.md
'''

[tasks."deploy:site"]
description = "Deploy bootstrap.azohra.com from the tip of main"
depends = ["test:site"]
confirm = "Deploy bootstrap.azohra.com to production?"
timeout = "10m"
usage = '''
flag "--dry-run" help="Bundle the Worker without shipping"
flag "--no-verify" help="Skip the public byte check, which GitHub-hosted runners cannot pass"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_dry_run:-false}" = true ]; then
  (cd site && wrangler deploy --dry-run)
  exit 0
fi
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy:site: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "deploy:site: refusing — CLOUDFLARE_ACCOUNT_ID is unset" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy:site: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy:site: refusing — HEAD is not the tip of origin/main" >&2; exit 1; }
(cd site && wrangler deploy)
[ "${usage_no_verify:-false}" != true ] || exit 0
live=$(mktemp "${TMPDIR:-/tmp}/bootstrap-live.XXXXXX")
trap 'rm -f "$live"' EXIT
for attempt in {1..10}; do
  if curl -fsS --connect-timeout 5 --max-time 15 https://bootstrap.azohra.com/ -o "$live" && cmp -s bootstrap.sh "$live"; then
    echo "deploy:site: production serves bootstrap.sh"
    exit 0
  fi
  [ "$attempt" -eq 10 ] || sleep 3
done
echo "deploy:site: production did not serve bootstrap.sh after deployment" >&2
exit 1
'''

[tasks."seed:github"]
description = "Install the site deployment secrets in the GitHub repository"
tools = { gh = "2.100.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${CLOUDFLARE_API_TOKEN:?seed:github: CLOUDFLARE_API_TOKEN is unset}"
: "${CLOUDFLARE_ACCOUNT_ID:?seed:github: CLOUDFLARE_ACCOUNT_ID is unset}"
[ "$(gh api user --jq .login)" = "azohra" ] || { echo "seed:github: GitHub account is not azohra" >&2; exit 1; }
for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
  printf '%s' "${!name}" | gh secret set "$name" --app actions --repo azohra/config
  gh secret list --app actions --repo azohra/config | awk '{print $1}' | grep -qx "$name"
done
echo "seed:github: site deployment secrets installed"
'''
