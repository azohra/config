# Config converges a Mac against one exact mise, spelled as testedMiseVersion in
# internal/config/mise.go. TestMisePhasesCoverEveryBootstrapPhase reads the mise
# on PATH, so the toolchain has to be that same release for the guard to mean
# anything. Move this line, the workflow pins, and testedMiseVersion together.
min_version = "2026.9.11"

[settings]
# The task artifact cache: a task whose inputs are unchanged replays its
# result instead of running again, on a laptop and on a runner alike.
experimental = true

# Shared inputs cover Go source and modules, or bootstrap.sh and site/.
# The Go check also reads testdata fixtures. The platform is part of every
# key, because the checks run on two of them.
[task_config]
global_inputs = ["mise.toml"]

[task_config.cache]
enabled = true
command_inputs = ["uname -sm"]

[task_config.input_groups]
go = ["**/*.go", "go.mod", "go.sum"]
site = ["bootstrap.sh", "site/**", "!site/.wrangler/**"]

[vars]
changelog_config = "https://raw.githubusercontent.com/azohra/.github/main/cliff.toml"

[tools]
go = "1.27.1"
git-cliff = "2.14.1"
gitleaks = "8.30.0"
goreleaser = "2.18.1"
node = "24"
shellcheck = "0.11.0"
wrangler = "4.129.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tasks.format]
description = "Format Go source"
run = "gofmt -w cmd internal"

[tasks.build]
description = "Build Config for the current platform"
run = "mkdir -p .build && go build -trimpath -o .build/config ./cmd/config"
sources = ["@group:go"]
outputs = [".build/config"]

[tasks."test:site"]
description = "Lint and prove the bootstrap script"
sources = ["@group:site"]
outputs = []
run = "bash -n bootstrap.sh && shellcheck -s bash bootstrap.sh && node --test site/bootstrap.test.mjs"

[tasks."check:go"]
description = "Formatting, vet and the race-detected test suite"
sources = ["@group:go", "**/testdata/**"]
outputs = []
run = """
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(gofmt -l cmd internal)
[[ -z $unformatted ]] || { printf 'Run gofmt on:\n%s\n' "$unformatted" >&2; exit 1; }
go vet ./...
go test -race ./...
"""

# Reads the vulnerability database of the day; never cached.
[tasks."check:deps"]
description = "Known vulnerabilities and module integrity"
run = "govulncheck ./... && go mod verify"

# Reads the whole history; never cached.
[tasks."check:secrets"]
description = "No secret in the tree or anywhere in history"
run = """
#!/usr/bin/env bash
set -euo pipefail
gitleaks dir --no-banner --redact .
# gitleaks dir reads the working tree, and gitleaks git scans nothing at all
# from a worktree, where .git is a file. History is permanent, so it is scanned
# from the log itself.
git log --all -p | gitleaks stdin --no-banner --redact
"""

[tasks.check]
description = "The definition of green"
depends = ["check:go", "check:deps", "check:secrets", "test:site"]

[tasks."check:darwin-native"]
description = "Read Finder Favorites through the native macOS integration"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ $(uname -s) == Darwin ]] || {
  echo "check:darwin-native: this canary requires macOS" >&2
  exit 1
}
tests=$(go test -tags=config_native_canary ./internal/config \
  -list '^TestFinderFavoritesNativeCanary$')
grep -qx 'TestFinderFavoritesNativeCanary' <<<"$tests" || {
  echo "check:darwin-native: the Finder Favorites canary is unavailable" >&2
  exit 1
}
go test -tags=config_native_canary ./internal/config \
  -run '^TestFinderFavoritesNativeCanary$' -count=1

# The Chrome PWA tests skip themselves when Chrome is absent, and a skip is
# invisible in an ordinary run. Select them by prefix rather than by name, so a
# Chrome-dependent test written tomorrow is covered the day it is written.
output=$(go test ./internal/config -run '^TestChromePWA' -count=1 -v)
printf '%s\n' "$output"
if grep -q -- '--- SKIP' <<<"$output"; then
  echo "check:darwin-native: a Chrome PWA proof skipped itself" >&2
  exit 1
fi
declared=$(go test ./internal/config -list '^TestChromePWA' | grep -c '^TestChromePWA' || true)
passed=$(grep -c -- '--- PASS: TestChromePWA' <<<"$output" || true)
[[ $declared -gt 0 && $passed -eq $declared ]] || {
  echo "check:darwin-native: $passed of $declared Chrome PWA proofs ran" >&2
  exit 1
}
"""

[tasks.dist]
description = "Build the release archive, checksums and cask into dist/ without publishing"
sources = ["@group:go", ".goreleaser.yaml", "LICENSE"]
outputs = []
env = { HOMEBREW_TOOLS_TOKEN = "snapshot" }
run = "goreleaser release --snapshot --clean"

[tasks.changelog]
description = "Render change history or export structured records"
usage = 'flag "--json" help="Export structured Git history"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_json:-false}" = true ]; then
  exec git cliff --config-url "{{vars.changelog_config}}" --context
fi
git cliff --config-url "{{vars.changelog_config}}"
'''

[tasks.release]
description = "Publish the release for the checked-out tag"
run = "goreleaser release --clean"

[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  BOSUN_PRIVATE_KEY
secret  CLOUDFLARE_ACCOUNT_ID
secret  CLOUDFLARE_API_TOKEN
secret  GITHUB_TOKEN
value   BOSUN_CLIENT_ID
CONTRACT
"""

[tasks.dev]
description = "Dev server for the site; no secrets"
dir = "site"
run = "wrangler dev --local --port 8787"

[tasks.deploy]
description = "Deploy the site at the tip of main"
confirm = "Deploy bootstrap.azohra.com to production?"
timeout = "10m"
usage = '''
flag "--dry-run" help="Bundle the Worker without shipping"
flag "--no-verify" help="Skip the public byte check"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_dry_run:-false}" = true ]; then
  (cd site && wrangler deploy --dry-run)
  exit 0
fi
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "deploy: refusing — CLOUDFLARE_ACCOUNT_ID is unset" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy: refusing — HEAD is not the tip of origin/main" >&2; exit 1; }
(cd site && wrangler deploy)
[ "${usage_no_verify:-false}" != true ] || exit 0
live=$(mktemp "${TMPDIR:-/tmp}/bootstrap-live.XXXXXX")
trap 'rm -f "$live"' EXIT
for attempt in {1..10}; do
  if curl -fsS --connect-timeout 5 --max-time 15 https://bootstrap.azohra.com/ -o "$live" && cmp -s bootstrap.sh "$live"; then
    echo "deploy: production serves bootstrap.sh"
    exit 0
  fi
  [ "$attempt" -eq 10 ] || sleep 3
done
echo "deploy: production did not serve bootstrap.sh after deployment" >&2
exit 1
'''
