# Config converges a Mac against one exact mise, spelled as testedMiseVersion in
# internal/config/mise.go. TestMisePhasesCoverEveryBootstrapPhase reads the mise
# on PATH, so the toolchain has to be that same release for the guard to mean
# anything. Move this line, the workflow pins, and testedMiseVersion together.
min_version = "2026.9.1"

[tools]
go = "1.27.1"
git-cliff = "2.14.1"
gitleaks = "8.30.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tasks.format]
description = "Format Go source"
run = "gofmt -w cmd internal"

[tasks.build]
description = "Build Config for the current platform"
run = "mkdir -p .build && go build -trimpath -o .build/config ./cmd/config"
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go"]
outputs = [".build/config"]

[tasks.check]
description = "Prove formatting, behavior, dependencies, and repository safety"
run = """
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(gofmt -l cmd internal)
[[ -z $unformatted ]] || { printf 'Run gofmt on:\n%s\n' "$unformatted" >&2; exit 1; }
go vet ./...
go test -race ./...
govulncheck ./...
go mod verify
gitleaks dir --no-banner --redact .
# gitleaks dir reads the working tree, and gitleaks git scans nothing at all
# from a worktree, where .git is a file. History is permanent, so it is scanned
# from the log itself.
git log --all -p | gitleaks stdin --no-banner --redact
"""

[tasks."check:darwin-native"]
description = "Read Finder Favorites through the native macOS integration"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ $(uname -s) == Darwin ]] || {
  echo "check:darwin-native: this canary requires macOS" >&2
  exit 1
}
tests=$(go test -tags=config_native_canary ./internal/config \
  -list '^TestFinderFavoritesNativeCanary$')
grep -qx 'TestFinderFavoritesNativeCanary' <<<"$tests" || {
  echo "check:darwin-native: the Finder Favorites canary is unavailable" >&2
  exit 1
}
go test -tags=config_native_canary ./internal/config \
  -run '^TestFinderFavoritesNativeCanary$' -count=1

# The Chrome PWA tests skip themselves when Chrome is absent, and a skip is
# invisible in an ordinary run. Select them by prefix rather than by name, so a
# Chrome-dependent test written tomorrow is covered the day it is written.
output=$(go test ./internal/config -run '^TestChromePWA' -count=1 -v)
printf '%s\n' "$output"
if grep -q -- '--- SKIP' <<<"$output"; then
  echo "check:darwin-native: a Chrome PWA proof skipped itself" >&2
  exit 1
fi
declared=$(go test ./internal/config -list '^TestChromePWA' | grep -c '^TestChromePWA' || true)
passed=$(grep -c -- '--- PASS: TestChromePWA' <<<"$output" || true)
[[ $declared -gt 0 && $passed -eq $declared ]] || {
  echo "check:darwin-native: $passed of $declared Chrome PWA proofs ran" >&2
  exit 1
}
"""

[tasks."build:dist"]
description = "Build release binaries and checksums without publishing"

run = """
#!/usr/bin/env bash
set -euo pipefail
tag="${RELEASE_VERSION:-v0.0.0-dev}"
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
  echo "build:dist: $tag is not a release tag" >&2
  exit 1
}
rm -rf -- dist
mkdir -p dist
for arch in arm64 amd64; do
  output="dist/config-darwin-$arch"
  CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
    go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$tag" -o "$output" ./cmd/config
done
printf '%s\n' "$tag" > dist/version.txt
cp LICENSE dist/LICENSE
license_dir=dist/third-party-licenses
mkdir -p "$license_dir"
for arch in arm64 amd64; do
  GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 \
    go-licenses save ./cmd/config \
      --ignore github.com/azohra/config \
      --save_path "$license_dir/config-darwin-$arch"
done
COPYFILE_DISABLE=1 tar -czf dist/third-party-licenses.tar.gz \
  -C dist third-party-licenses
rm -rf -- "$license_dir"
if command -v sha256sum >/dev/null 2>&1; then
  (cd dist && sha256sum \
    LICENSE config-darwin-* third-party-licenses.tar.gz version.txt > checksums.txt)
else
  (cd dist && shasum -a 256 \
    LICENSE config-darwin-* third-party-licenses.tar.gz version.txt > checksums.txt)
fi
"""

[tasks.changelog]
description = "Render the changelog from Conventional commits"
run = "git cliff"

[tasks.release]
description = "Build and publish a release from current main"
tools = { gh = "2.100.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -z "$(git status --porcelain)" ] || { echo 'release: commit changes first' >&2; exit 1; }
git fetch -q origin main --tags
head=$(git rev-parse HEAD)
[ "$head" = "$(git rev-parse origin/main)" ] || { echo 'release: check out current main first' >&2; exit 1; }
tag=$(git cliff --offline --unreleased --bumped-version)
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
[ "$tag" != "$(git describe --tags --abbrev=0 --match 'v[0-9]*')" ] || { echo 'No new Conventional changes to release'; exit 0; }
RELEASE_VERSION="$tag" mise run build:dist
git cliff --unreleased --tag "$tag" > dist/notes.md
gh release create "$tag" dist/config-darwin-* dist/LICENSE dist/third-party-licenses.tar.gz dist/checksums.txt dist/version.txt \
  --repo azohra/config --target "$head" \
  --title "Config $tag" --notes-file dist/notes.md
'''
