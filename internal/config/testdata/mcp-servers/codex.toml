# Codex configuration
model = "gpt-5-codex"
approval_policy = "on-request"

[projects."/Users/example/project"]
trust_level = "trusted"

# A server Config never wrote
[mcp_servers.foreign]
command = "foreign-mcp"
args = ["--serve"]

[mcp_servers.foreign.env]
FOREIGN = "1"   # keep me

[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp", "--old"]
startup_timeout_sec = 20

[shell_environment_policy]
inherit = "all"
